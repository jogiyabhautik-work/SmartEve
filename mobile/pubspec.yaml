name: smarteve_mobile
description: "SmartEve - Mission-critical mobile co-pilot for anchors, organizers, and stage managers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Networking
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Firebase Suite (Authentication, FCM Push Notifications, Analytics)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.1.2

  # Cloudinary & Image Handling
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Speech & Audio Synthesis
  flutter_tts: ^4.2.2

  # UI, Fonts & Formatting
  intl: ^0.19.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  postgres: ^3.5.15
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/smartEVE-icon.png"
  notification_icon:
    android: true
    image_path: "assets/trans_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/

    
